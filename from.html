<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENTA FEST Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:linear-gradient(135deg,#eef4ff,#f8fbff);
min-height:100vh;color:#111;padding-bottom:110px
}
.container{width:min(100%,1100px);margin:auto;padding:15px}
.hero{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
background-size:300% 300%;
animation:bgmove 10s infinite ease;
padding:60px 25px;border-radius:0 0 35px 35px;color:#fff
}
@keyframes bgmove{
0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}
}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:800}
.hero p{opacity:.9;margin-top:10px}
.card{
background:rgba(255,255,255,.85);
backdrop-filter:blur(20px);
padding:24px;margin:18px 0;border-radius:28px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
animation:fade .5s ease
}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.title{font-size:20px;font-weight:700;color:#0077ff;margin-bottom:15px}
label{display:block;font-weight:600;margin-top:14px}
input,select,textarea{
width:100%;padding:15px;border-radius:16px;border:2px solid #e5e7eb;
margin-top:8px;transition:.3s
}
input:focus,select:focus,textarea:focus{
outline:none;border-color:#00c8ff;box-shadow:0 0 0 5px rgba(0,200,255,.15)
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.summary{display:flex;justify-content:space-between;margin:10px 0}
.total{font-size:28px;font-weight:800;color:#0077ff}
.check{display:flex;gap:10px;margin-top:14px}
.bottom{
position:fixed;left:0;right:0;bottom:0;background:#fff;padding:15px;
box-shadow:0 -10px 30px rgba(0,0,0,.08)
}
.btn{
width:min(100%,1100px);display:block;margin:auto;padding:18px;border:none;
border-radius:18px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;
background:linear-gradient(135deg,#00c8ff,#0077ff)
}
#loading{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
justify-content:center;align-items:center;flex-direction:column;color:#fff;z-index:9999
}
.spinner{
width:70px;height:70px;border:6px solid rgba(255,255,255,.2);
border-top-color:#00c8ff;border-radius:50%;animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{width:280px;height:10px;background:#333;border-radius:99px;overflow:hidden;margin-top:20px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#00c8ff,#0077ff)}
footer{text-align:center;padding:40px 20px;color:#64748b}
@media(max-width:768px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero">
<div class="container">
<h1>MOMENTA FEST 2026</h1>
<p>addtio</p>
</div>
</div>

<div class="container">
<div class="card">
<div class="title">Ringkasan Pesanan</div>
<div class="summary"><span>Jenis Tiket</span><strong>EXTRA SALE FESTIVAL</strong></div>
<div class="summary"><span>Jumlah Tiket</span><strong>1</strong></div>
<div class="summary total"><span>Total</span><span>Rp150.000</span></div>
</div>

<div class="card">
<div class="title">Data Pemesan</div>
<label>Nama Lengkap</label><input id="nama">
<div class="row">
<div><label>Jenis Identitas</label><select id="identitas"><option>Pilih</option><option>KTP</option><option>SIM</option><option>Paspor</option></select></div>
<div><label>Nomor Identitas</label><input id="nomorId"></div>
</div>
<div class="row">
<div><label>Email</label><input type="email" id="email"></div>
<div><label>WhatsApp</label><input id="wa"></div>
</div>
<label>Alamat</label><textarea id="alamat"></textarea>
</div>

<div class="card">
<div class="title">Persetujuan</div>
<div class="check"><input type="checkbox" id="c1"><span>Data yang diisi benar.</span></div>
<div class="check"><input type="checkbox" id="c2"><span>Menyetujui syarat dan ketentuan.</span></div>
</div>
</div>

<div class="bottom"><button class="btn" onclick="proses()">LANJUT KE PEMBAYARAN</button></div>

<div id="loading">
<div class="spinner"></div>
<h3 id="status" style="margin-top:20px">Memvalidasi Data...</h3>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="percent" style="margin-top:10px">0%</div>
</div>

<footer>© 2026 MOMENTA FEST • Premium Edition</footer>

<script>
function proses(){
const ids=['nama','nomorId','email','wa','alamat'];
for(let i of ids){if(!document.getElementById(i).value.trim()){alert('Lengkapi data');return;}}
if(!c1.checked||!c2.checked){alert('Centang persetujuan');return;}
loading.style.display='flex';
let p=0;
const txt=['Memvalidasi Data...','Mengamankan Transaksi...','Menyiapkan Pembayaran...','Menghubungkan Gateway...','Mengalihkan...'];
let t=0;
const x=setInterval(()=>{
p+=20; bar.style.width=p+'%'; percent.innerText=p+'%';
if(t<txt.length-1){t++;status.innerText=txt[t];}
if(p>=100){clearInterval(x);setTimeout(()=>location.href='qris.html',500);}
},1000);
}
</script>
</body>
</html>
